name: API Integration & Performance Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # --- JOB 1: Functional Integration Testing ---
  integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask

    - name: Start Flask API in Background
      run: |
        python api.py & 
        sleep 5 

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Newman
      run: npm install -g newman

    - name: Run Newman Tests
      run: |
        newman run integration-tests.json --global-var "baseURL=http://127.0.0.1:5000"

  # --- JOB 2: Performance Testing (Task 5) ---
  performance-test:
    needs: integration-test # This ensures it runs AFTER Job 1 passes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Start Flask API
      run: |
        pip install Flask
        python api.py &
        sleep 5

    - name: Run k6 Load Test
      uses: grafana/k6-action@v0.3.1
      with:
        filename: performance-test.js
  
  security-scan:
    needs: performance-test # Runs after performance tests pass
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload security results
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
  